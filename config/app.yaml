# config/app.yaml
# 服务配置
server:
  port: 8080        # HTTP 服务端口
  mode: debug       # Gin 运行模式（debug/release/test）
  timeout: 30s      # 服务超时时间

# 数据库配置（MySQL）
database:
  driver: mysql
  dsn: root:root@tcp(127.0.0.1:3306)/goblog?charset=utf8mb4&parseTime=True&loc=Local
  max_open_conns: 100  # 最大连接数
  max_idle_conns: 20   # 最大空闲连接数
  conn_max_lifetime: 30m # 连接存活时间

# 日志配置（可选，后续扩展用）
log:
  level: info
  path: logs/blog.log
  max_size: 100  # 单个日志文件大小(MB)
  max_backup: 10 # 日志备份数